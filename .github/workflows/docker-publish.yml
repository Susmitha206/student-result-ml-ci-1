
name: Docker Build, Test and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/susmithavanama/student-result-ml:latest .

      - name: Start container
        run: |
          docker run -d --name student-result-test -p 8000:5000 ghcr.io/susmithavanama/student-result-ml:latest

      - name: Test health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs student-result-test
          exit 1

      - name: Stop and remove test container
        if: always()
        run: docker rm -f student-result-test || true

      - name: Publish Docker image
        run: |
          docker push ghcr.io/susmithavanama/student-result-ml:latest
          docker tag ghcr.io/susmithavanama/student-result-ml:latest ghcr.io/susmithavanama/student-result-ml:sha-${{ github.sha }}
          docker push ghcr.io/susmithavanama/student-result-ml:sha-${{ github.sha }}
