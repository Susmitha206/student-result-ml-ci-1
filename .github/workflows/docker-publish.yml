
name: Docker Build, Test and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/susmitha206/student-result-ml:latest .

      - name: Start container
        run: |
          docker run -d --name student-result-test -p 8000:5000 ghcr.io/susmitha206/student-result-ml:latest

      - name: Test health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-test
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":90,"previous_score":82}'

      - name: Stop and remove test container
        if: always()
        run: docker rm -f student-result-test || true

      - name: Publish Docker image
        run: |
          docker push ghcr.io/susmitha206/student-result-ml:latest
          docker tag ghcr.io/susmitha206/student-result-ml:latest ghcr.io/susmitha206/student-result-ml:sha-${{ github.sha }}
          docker push ghcr.io/susmitha206/student-result-ml:sha-${{ github.sha }}
